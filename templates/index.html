<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kod Kubanca — Frizerski Salon</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color: #121212; color: #ffffff; }
.gold-border { border-color: #d4af37; }
.gold-bg { background-color: #d4af37; }
.gold-text { color: #d4af37; }

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal-overlay.show {
  display: flex;
}

.modal-content {
  background: #1e1e1e;
  border: 2px solid #d4af37;
  border-radius: 12px;
  padding: 30px;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.modal-content h2 {
  color: #d4af37;
  font-size: 24px;
  margin-bottom: 20px;
}

.modal-content .detail-row {
  background: #27272a;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  font-size: 14px;
}

.modal-content .detail-row strong {
  color: #d4af37;
  display: block;
  font-size: 16px;
  margin-top: 5px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
}

.btn-ok {
  background: #d4af37;
  color: #000;
}

.btn-ok:hover {
  background: #e5c158;
  transform: scale(1.05);
}

.btn-back {
  background: #52525b;
  color: #fff;
}

.btn-back:hover {
  background: #71717a;
}
</style>
</head>
<body class="p-4 max-w-md mx-auto space-y-6">

<!-- Modal za potvrdu zakazivanja -->
<div id="modalPotvrda" class="modal-overlay">
  <div class="modal-content">
    <h2>✅ Termin zakazan!</h2>
    <div id="modalDetalji"></div>
    <div class="modal-actions">
      <button class="btn-ok" onclick="zatvoriModal()">OK</button>
    </div>
  </div>
</div>

<!-- Header sa logotipom i radnim vremenom -->
<header class="text-center py-2 space-y-3">
<!-- Logo slika -->
<div class="flex justify-center">
<img 
src="https://github.com/ristevskin-source/brica-novipristup/blob/main/static/logo.jpg?raw=true" 
alt="" 
class="h-56 w-auto object-contain mx-auto drop-shadow-xl rounded-lg">
</div>

<!-- Radno Vreme -->
<div class="inline-block bg-zinc-900 border gold-border px-4 py-1.5 rounded-full text-xs text-gray-300 shadow-md">
🕒 Radno vreme: <span class="gold-text font-bold">09:00 - 20:00</span> (Pauza: 13:00 - 14:00)
</div>
</header>

<!-- Izbor Usluge -->
<div class="bg-zinc-900 p-4 rounded-xl border gold-border space-y-3 shadow-lg">
<h2 class="text-lg font-bold gold-text">1. Izaberite uslugu</h2>
<div id="listaUsluga" class="space-y-2">
<p class="text-xs text-gray-400">Učitavanje usluga...</p>
</div>
</div>

<!-- Izbor Datuma i Vremena -->
<div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3 shadow-lg">
<h2 class="text-lg font-bold gold-text">2. Izaberite datum</h2>
<input type="date" id="datumInput" class="w-full bg-zinc-800 text-white p-2.5 rounded border border-zinc-700 text-sm outline-none focus:border-yellow-500">

<h3 class="text-sm font-semibold text-gray-300 pt-2">Slobodni termini:</h3>
<div id="mrezaSlotova" class="grid grid-cols-4 gap-2 pt-1">
<p class="col-span-4 text-xs text-gray-400 text-center">Izaberite datum iznad</p>
</div>
</div>

<!-- Forma za Zakazivanje -->
<div id="formaZakazivanje" class="bg-zinc-900 p-4 rounded-xl border gold-border space-y-3 hidden shadow-xl">
<h2 class="text-lg font-bold gold-text">3. Unesite vaše podatke</h2>
<p id="izabraniInfo" class="text-xs text-gray-300 bg-zinc-800 p-2 rounded border border-zinc-700"></p>

<form onsubmit="event.preventDefault(); potvrdizakazivanje();" class="space-y-3">
<div>
<label class="block text-xs text-gray-400 mb-1">Ime i prezime *</label>
<input type="text" id="klijentIme" required placeholder="Vaše ime" class="w-full bg-zinc-800 p-2.5 rounded text-white border border-zinc-700 text-sm outline-none focus:border-yellow-500">
</div>
<div>
<label class="block text-xs text-gray-400 mb-1">Broj telefona *</label>
<input type="tel" id="klijentTel" required placeholder="06x xxx xxxx" class="w-full bg-zinc-800 p-2.5 rounded text-white border border-zinc-700 text-sm outline-none focus:border-yellow-500">
</div>
<button type="submit" class="w-full py-3 gold-bg text-black font-bold rounded-lg text-sm uppercase tracking-wider hover:bg-yellow-500 transition">Potvrdi Zakazivanje</button>
</form>
</div>

<!-- Admin Link na dnu -->
<footer class="text-center pt-4">
<a href="/admin" style="color: #6c757d; text-decoration: none; font-size: 1.2rem;">🔐</a>
</footer>

<script>
let izabranaUsluga = null;
let izabraniDatum = null;
let izabranoVreme = null;

// Usluge globalno (popunjava se u ucitajUsluge)
let uslugeGlobal = [];

async function ucitajUsluge() {
    try {
        const res = await fetch('/api/usluge');
        if (!res.ok) throw new Error('Greška pri učitavanju usluga');
        const usluge = await res.json();
        uslugeGlobal = Array.isArray(usluge) ? usluge : (usluge.usluge || []);
        const container = document.getElementById('listaUsluga');

        if (!uslugeGlobal.length) {
            container.innerHTML = '<p class="text-xs text-gray-400">Nema usluga.</p>';
            return;
        }

        container.innerHTML = uslugeGlobal.map((u, index) => `
            <label class="flex justify-between items-center p-3 bg-zinc-800 rounded-lg border border-zinc-700 cursor-pointer hover:border-yellow-500 transition">
                <div class="flex items-center gap-2">
                    <input type="radio" name="uslugaRadio" value="${u.id}" ${index === 0 ? 'checked' : ''} onchange='postaviUslugu(${JSON.stringify(u)})' class="accent-yellow-500">
                    <span class="text-sm font-semibold">${u.ime}</span>
                </div>
                <span class="text-xs gold-text font-bold">${u.cena} RSD</span>
            </label>
        `).join('');

        // Postavi prvu uslugu kao podrazumevanu
        izabranaUsluga = uslugeGlobal[0];
        azurirajInfo();
    } catch (e) {
        console.error(e);
        document.getElementById('listaUsluga').innerHTML = '<p class="text-xs text-gray-400">Greška pri učitavanju usluga.</p>';
    }
}

function postaviUslugu(u) {
    izabranaUsluga = u;
    azurirajInfo();
}

const datumInput = document.getElementById('datumInput');
const danas = new Date().toISOString().split('T')[0];
datumInput.min = danas;
datumInput.value = danas;
izabraniDatum = danas;

datumInput.addEventListener('change', (e) => {
    izabraniDatum = e.target.value;
    ucitajSlotove();
});

// Popravljena i pojednostavljena funkcija za učitavanje slotova
async function ucitajSlotove() {
    if (!izabraniDatum) return;

    try {
        const res = await fetch(`/api/slotovi/${izabraniDatum}`);
        if (!res.ok) throw new Error('Greška u odgovoru servera');
        const data = await res.json();

        // Podržavamo dva formata: niz slotova ili objekat { slotovi: [...] }
        const slotovi = Array.isArray(data) ? data : (data.slotovi || []);
        const container = document.getElementById('mrezaSlotova');

        if (!Array.isArray(slotovi) || slotovi.length === 0) {
            container.innerHTML = '<p class="col-span-4 text-xs text-gray-400 text-center">Nema dostupnih slotova.</p>';
            return;
        }

        container.innerHTML = slotovi.map(s => {
            // s može biti {vreme: "09:00", status: "slobodan"} ili string "09:00"
            const vreme = (typeof s === 'string') ? s : (s.vreme || '');
            const statusRaw = (typeof s === 'string') ? 'slobodan' : (s.status || (s.ime ? 'zauzet' : 'slobodan'));
            const status = statusRaw.toString().toLowerCase();

            // Pauza: 13:00 - 14:00 (usklađeno sa prikazom)
            if (vreme >= "13:00" && vreme < "14:00") {
                return `<div class="p-2 bg-zinc-950/60 border border-zinc-800/80 rounded text-[10px] text-red-500/50 text-center font-semibold">PAUZA</div>`;
            } else if (status === 'slobodan' || status === 'free' || status === 'available') {
                return `<button onclick="izaberiTermin('${vreme}')" class="p-2 bg-zinc-800 hover:bg-yellow-500 hover:text-black border border-zinc-700 rounded text-xs text-center font-semibold transition">${vreme}</button>`;
            } else {
                return `<div class="p-2 bg-zinc-950 border border-zinc-900 rounded text-xs text-zinc-600 text-center line-through">${vreme}</div>`;
            }
        }).join('');
    } catch (e) {
        console.error("Greška pri učitavanju slotova:", e);
        document.getElementById('mrezaSlotova').innerHTML = '<p class="col-span-4 text-xs text-gray-400 text-center">Greška pri učitavanju slotova.</p>';
    }
}

function izaberiTermin(vreme) {
    izabranoVreme = vreme;
    document.getElementById('formaZakazivanje').classList.remove('hidden');
    azurirajInfo();
    document.getElementById('formaZakazivanje').scrollIntoView({ behavior: 'smooth' });
}

function azurirajInfo() {
    if (izabranaUsluga && izabraniDatum && izabranoVreme) {
        document.getElementById('izabraniInfo').innerHTML = `
            ✂️ <strong>${izabranaUsluga.ime}</strong> (${izabranaUsluga.cena} RSD)<br>
            📅 <strong>${izabraniDatum}</strong> u <strong>${izabranoVreme} h</strong>
        `;
    } else if (izabranaUsluga) {
        document.getElementById('izabraniInfo').innerHTML = `
            ✂️ <strong>${izabranaUsluga.ime}</strong> (${izabranaUsluga.cena} RSD)
        `;
    } else {
        document.getElementById('izabraniInfo').textContent = '';
    }
}

function prikaziModalPotvrde(rez) {
    const modal = document.getElementById('modalPotvrda');
    const detalji = document.getElementById('modalDetalji');
    
    detalji.innerHTML = `
        <div class="detail-row">
            📅 Datum
            <strong>${rez.datum}</strong>
        </div>
        <div class="detail-row">
            🕐 Vreme
            <strong>${rez.vreme} h</strong>
        </div>
        <div class="detail-row">
            ✂️ Usluga
            <strong>${rez.usluga}</strong>
        </div>
        <div class="detail-row">
            💰 Cena
            <strong>${rez.cena} RSD</strong>
        </div>
        <div class="detail-row">
            👤 Klijent
            <strong>${rez.ime}</strong>
        </div>
        <div class="detail-row">
            📱 Telefon
            <strong>${rez.telefon}</strong>
        </div>
    `;
    
    modal.classList.add('show');
}

function zatvoriModal() {
    document.getElementById('modalPotvrda').classList.remove('show');
    // Resetuj formu i osvežи slotove
    document.getElementById('formaZakazivanje').classList.add('hidden');
    document.getElementById('klijentIme').value = '';
    document.getElementById('klijentTel').value = '';
    izabranoVreme = null;
    ucitajSlotove();
}

async function potvrdizakazivanje() {
    const ime = document.getElementById('klijentIme').value.trim();
    const telefon = document.getElementById('klijentTel').value.trim();

    if (!izabranaUsluga) {
        alert('Izaberite uslugu.');
        return;
    }
    if (!izabraniDatum) {
        alert('Izaberite datum.');
        return;
    }
    if (!izabranoVreme) {
        alert('Izaberite termin.');
        return;
    }
    if (!ime || !telefon) {
        alert('Popunite ime i broj telefona.');
        return;
    }

    try {
        const res = await fetch('/api/zakazi', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                datum: izabraniDatum,
                vreme: izabranoVreme,
                ime: ime,
                telefon: telefon,
                usluga: izabranaUsluga.ime,
                cena: izabranaUsluga.cena
            })
        });

        const data = await res.json();
        if (res.ok && data.status === 'ok') {
            // Prikaži modal sa potvrdom
            prikaziModalPotvrde(data.rezervacija);
        } else {
            alert(data.poruka || 'Greška pri zakazivanju.');
        }
    } catch (e) {
        console.error('Greška pri slanju zahteva:', e);
        alert('Greška pri zakazivanju, pokušajte ponovo.');
    }
}

document.addEventListener("DOMContentLoaded", function() {
    ucitajUsluge();
    ucitajSlotove();
});
</script>  
</body>
</html>
