<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zakazivanje termina</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #121212; color: #e0e0e0; }
        h1, h2 { color: #ffffff; }
        .section { background: #1e1e1e; padding: 20px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #27272a; }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        input, select { padding: 8px; border: 1px solid #3f3f46; border-radius: 4px; background: #27272a; color: white; }
        button { padding: 8px 16px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        
        .slotovi-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .slot { padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; text-align: center; }
        .slot.slobodan { background: #16a34a; color: white; }
        .slot.zauzet { background: #dc2626; color: white; cursor: not-allowed; opacity: 0.7; }
        .slot.izabran { background: #ca8a04; color: white; border: 2px solid #fff; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <h1>Zakazivanje termina</h1>

    <div class="section">
        <h2>1. Izaberi datum i uslugu</h2>
        <div class="form-group">
            <label>Datum:</label>
            <input type="date" id="datumInput" onchange="ucitajSlotove()">
            
            <label>Usluga:</label>
            <select id="uslugaSelect" onchange="azurirajCenuIUslugu()">
                <option value="">Učitavanje usluga...</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>2. Izaberi slobodan termin</h2>
        <div id="slotoviKontejner" class="slotovi-grid">
            <p style="color: #a1a1aa;">Prvo izaberi datum.</p>
        </div>
    </div>

    <div class="section" id="formaSekcija" style="display:none;">
        <h2>3. Podaci o klijentu</h2>
        <div class="form-group">
            <input type="text" id="imeInput" placeholder="Vaše ime i prezime">
            <input type="text" id="telefonInput" placeholder="Broj telefona">
            <button onclick="zakaziTermin()" style="background: #16a34a;">Potvrdi rezervaciju</button>
        </div>
    </div>

    <script>
        let izabraniTermin = null;
        let izabranaUslugaCena = 0;
        let izabraniNazivUsluge = '';
        let uslugeLista = [];

        async function ucitajUslugeZaKorisnika() {
            try {
                let res = await fetch('/api/usluge');
                uslugeLista = await res.json();
                let select = document.getElementById('uslugaSelect');
                select.innerHTML = '';
                
                if (!uslugeLista || uslugeLista.length === 0) {
                    select.innerHTML = '<option value="">Nema dostupnih usluga</option>';
                    return;
                }

                uslugeLista.forEach(u => {
                    let opt = document.createElement('option');
                    opt.value = u.id;
                    opt.setAttribute('data-cena', u.cena);
                    opt.setAttribute('data-naziv', u.ime);
                    opt.text = `${u.ime} (${u.cena} RSD - ${u.trajanje || 30} min)`;
                    select.appendChild(opt);
                });

                azurirajCenuIUslugu();
            } catch (e) {
                console.error("Greška pri učitavanju usluga:", e);
            }
        }

        function azurirajCenuIUslugu() {
            let select = document.getElementById('uslugaSelect');
            let selectedOpt = select.options[select.selectedIndex];
            if (selectedOpt) {
                izabranaUslugaCena = Number(selectedOpt.getAttribute('data-cena')) || 0;
                izabraniNazivUsluge = selectedOpt.getAttribute('data-naziv') || '';
            }
        }

        async function ucitajSlotove() {
            let datum = document.getElementById('datumInput').value;
            if (!datum) return;

            try {
                let res = await fetch(`/api/slotovi/${datum}`);
                let slotovi = await res.json();
                let kontejner = document.getElementById('slotoviKontejner');
                kontejner.innerHTML = '';

                if (!slotovi || slotovi.length === 0) {
                    kontejner.innerHTML = '<p style="color: #ef4444;">Nedeljom ne radimo ili nema slotova za izabrani datum.</p>';
                    return;
                }

                slotovi.forEach(s => {
                    let div = document.createElement('div');
                    div.className = `slot ${s.status}`;
                    div.innerText = s.vreme;
                    
                    if (s.status === 'slobodan') {
                        div.onclick = () => izaberiSlot(s.vreme, div);
                    }
                    kontejner.appendChild(div);
                });
            } catch (e) {
                console.error("Greška pri učitavanju slotova:", e);
            }
        }

        function izaberiSlot(vreme, element) {
            document.querySelectorAll('.slot').forEach(el => {
                if(el.classList.contains('slobodan')) el.style.border = 'none';
            });
            
            izabraniTermin = vreme;
            element.style.border = '2px solid #ffffff';
            document.getElementById('formaSekcija').style.display = 'block';
        }

        async function zakaziTermin() {
            let datum = document.getElementById('datumInput').value;
            let ime = document.getElementById('imeInput').value.trim();
            let telefon = document.getElementById('telefonInput').value.trim();

            if (!datum || !izabraniTermin || !ime || !telefon || !izabraniNazivUsluge) {
                alert("Molimo popunite sva polja i izaberite slobodan termin!");
                return;
            }

            try {
                let res = await fetch('/api/zakazi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        datum: datum,
                        vreme: izabraniTermin,
                        ime: ime,
                        telefon: telefon,
                        usluga: izabraniNazivUsluge,
                        cena: izabranaUslugaCena
                    })
                });

                let data = await res.json();
                if (res.ok) {
                    alert("Uspešno ste zakazali termin!");
                    location.reload();
                } else {
                    alert("Greška: " + (data.poruka || 'Došlo je do greške'));
                }
            } catch (e) {
                console.error("Greška pri zakazivanju:", e);
                alert("Došlo je do greške na serveru.");
            }
        }

        document.getElementById('datumInput').valueAsDate = new Date();
        ucitajUslugeZaKorisnika();
        ucitajSlotove();
    </script>
</body>
</html>
