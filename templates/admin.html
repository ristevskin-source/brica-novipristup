<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Brica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .service-item:hover {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="bg-zinc-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Zaglavlje -->
        <div class="flex justify-between items-center mb-8 border-b border-zinc-700 pb-4">
            <h1 class="text-3xl font-bold text-amber-500">💈 Admin Panel - Brica</h1>
            <a href="/" class="bg-zinc-700 hover:bg-zinc-600 text-white px-4 py-2 rounded font-semibold text-sm">Nazad na sajt</a>
        </div>

        <!-- Navigacija za nedelje -->
        <div class="flex justify-between items-center bg-zinc-800 p-4 rounded-lg mb-6 border border-zinc-700">
            <button onclick="promeniNedelju(-1)" class="bg-amber-600 hover:bg-amber-500 text-black px-4 py-2 rounded font-bold">← Prethodna nedelja</button>
            <span id="rasponNedelje" class="text-lg font-bold text-zinc-300"></span>
            <button onclick="promeniNedelju(1)" class="bg-amber-600 hover:bg-amber-500 text-black px-4 py-2 rounded font-bold">Sledeća nedelja →</button>
        </div>

        <!-- Tabela rasporeda -->
        <div class="overflow-x-auto bg-zinc-800 rounded-lg border border-zinc-700 mb-8">
            <table class="w-full text-left text-sm">
                <thead class="bg-zinc-700 text-amber-500 uppercase font-bold text-center">
                    <tr id="zaglavljeTabele">
                        <th class="p-3 border-b border-zinc-600">Vreme</th>
                    </tr>
                </thead>
                <tbody id="teloTabele" class="divide-y divide-zinc-700 text-center">
                </tbody>
            </table>
        </div>

        <!-- ============================================ -->
        <!-- SEKCIJA ZA UPRAVLJANJE USLUGAMA - POPRAVLJENA -->
        <!-- ============================================ -->
        <div class="bg-zinc-800 p-6 rounded-lg border border-zinc-700">
            <h2 class="text-xl font-bold text-amber-500 mb-4">📋 Upravljanje uslugama i cenama</h2>
            
            <!-- RED ZA DODAVANJE -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6">
                <input type="text" id="novoIme" 
                       placeholder="Naziv usluge" 
                       class="p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-white focus:border-amber-500 focus:outline-none">
                <input type="number" id="novaCena" 
                       placeholder="Cena u RSD" 
                       class="p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-white focus:border-amber-500 focus:outline-none">
                <input type="number" id="novoTrajanje" 
                       placeholder="Trajanje (min)" value="30"
                       class="p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-white focus:border-amber-500 focus:outline-none">
                <button onclick="dodajNovuUslugu()" 
                        class="bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 rounded-lg transition-all">
                    ➕ Dodaj uslugu
                </button>
            </div>
            
            <!-- LISTA USLUGA -->
            <div id="listaUslugaAdmin" class="space-y-2">
                <div class="text-center py-4 text-zinc-500">⏳ Učitavanje usluga...</div>
            </div>
        </div>
    </div>

    <!-- Modal za ručno zakazivanje -->
    <div id="novaRezervacijaModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden">
        <div class="bg-zinc-800 p-6 rounded-lg border border-zinc-700 w-full max-w-md">
            <h3 class="text-lg font-bold text-amber-500 mb-4">Zakazivanje termina</h3>
            <div class="space-y-3">
                <input type="hidden" id="adminDatum">
                <input type="hidden" id="adminVreme">
                <div>
                    <label class="text-xs text-zinc-400">Ime klijenta:</label>
                    <input type="text" id="adminIme" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white">
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Telefon:</label>
                    <input type="text" id="adminTel" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white">
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Usluga:</label>
                    <select id="adminUsluga" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white"></select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="sacuvajAdminZakazivanje()" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-2 rounded">Potvrdi</button>
                    <button onclick="zatvoriNovoZakazivanje()" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-2 rounded">Otkaži</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ============================================
    // RASPORED - POSTOJEĆE FUNKCIJE
    // ============================================
    
    let trenutniPonedeljak = getPonedeljak(new Date());

    function getPonedeljak(d) {
        d = new Date(d);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function formatirajDatum(d) {
        return d.toISOString().split('T')[0];
    }

    function promeniNedelju(smer) {
        trenutniPonedeljak.setDate(trenutniPonedeljak.getDate() + (smer * 7));
        ucitajNedelju();
    }

    async function ucitajNedelju() {
        let dani = [];
        let imenaDana = ['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub'];
        let headerRow = '<th class="p-3 border-b border-zinc-600">Vreme</th>';
        for(let i=0; i<6; i++) {
            let d = new Date(trenutniPonedeljak);
            d.setDate(d.getDate() + i);
            let dStr = formatirajDatum(d);
            dani.push(dStr);
            headerRow += '<th class="p-3 border-b border-zinc-600">' + imenaDana[i] + '<br><span class="text-xs text-zinc-400">' + dStr.split('-').slice(1).join('.') + '</span></th>';
        }
        document.getElementById('zaglavljeTabele').innerHTML = headerRow;

        let prviDan = dani[0];
        let poslednjiDan = dani[5];
        document.getElementById('rasponNedelje').innerText = prviDan + ' do ' + poslednjiDan;

        try {
            let res = await fetch('/api/raspored_nedelja?pocetak=' + prviDan + '&kraj=' + poslednjiDan);
            let podaci = await res.json();

            let sati = ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30"];
            let tbody = '';
            sati.forEach(vreme => {
                tbody += '<tr><td class="p-2 font-bold text-amber-500 border-r border-zinc-700">' + vreme + '</td>';
                dani.forEach(datum => {
                    let klijent = podaci[datum] && podaci[datum][vreme] ? podaci[datum][vreme] : null;
                    if(klijent && klijent.status === 'zauzet') {
                        tbody += '<td class="p-2 border border-zinc-700 bg-red-900/40 text-red-200">' +
                            '<div class="font-bold text-xs">' + (klijent.ime || 'Zauzeto') + '</div>' +
                            '<div class="text-[10px] text-zinc-400">' + (klijent.usluga || '') + ' (' + (klijent.cena || 0) + ' RSD)</div>' +
                            '<button onclick="oslobodiTermin(\'' + datum + '\', \'' + vreme + '\')" class="mt-1 bg-red-800 hover:bg-red-700 text-white text-[10px] px-2 py-0.5 rounded">Oslobodi</button>' +
                        '</td>';
                    } else {
                        tbody += '<td class="p-2 border border-zinc-700 hover:bg-zinc-700/50 cursor-pointer" onclick="otvoriZakazivanje(\'' + datum + '\', \'' + vreme + '\')">' +
                            '<span class="text-xs text-zinc-500">+ Zakazi</span>' +
                        '</td>';
                    }
                });
                tbody += '</tr>';
            });
            document.getElementById('teloTabele').innerHTML = tbody;
        } catch (error) {
            console.error('Greška pri učitavanju rasporeda:', error);
            showToast('Greška pri učitavanju rasporeda', 'error');
        }
    }

    async function oslobodiTermin(datum, vreme) {
        if(confirm('Da li otkazujete termin ' + datum + ' u ' + vreme + '?')) {
            try {
                await fetch('/api/otkazi', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({datum: datum, vreme: vreme})
                });
                showToast('✅ Termin oslobođen', 'success');
                ucitajNedelju();
            } catch (error) {
                showToast('❌ Greška pri otkazivanju', 'error');
            }
        }
    }

    async function otvoriZakazivanje(datum, vreme) {
        document.getElementById('adminDatum').value = datum;
        document.getElementById('adminVreme').value = vreme;
        document.getElementById('adminIme').value = '';
        document.getElementById('adminTel').value = '';
        try {
            let res = await fetch('/api/usluge');
            let usluge = await res.json();
            let select = document.getElementById('adminUsluga');
            select.innerHTML = usluge.map(u => '<option value="' + u.ime + '|' + u.cena + '">' + u.ime + ' (' + u.cena + ' RSD)</option>').join('');
        } catch (error) {
            showToast('❌ Greška pri učitavanju usluga', 'error');
        }
        document.getElementById('novaRezervacijaModal').classList.remove('hidden');
    }

    function zatvoriNovoZakazivanje() {
        document.getElementById('novaRezervacijaModal').classList.add('hidden');
    }

    async function sacuvajAdminZakazivanje() {
        const datum = document.getElementById('adminDatum').value;
        const vreme = document.getElementById('adminVreme').value;
        const ime = document.getElementById('adminIme').value;
        const telefon = document.getElementById('adminTel').value;
        const uslugaVal = document.getElementById('adminUsluga').value.split('|');
        const usluga = uslugaVal[0];
        const cena = parseInt(uslugaVal[1]);

        try {
            const res = await fetch('/api/zakazi', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ datum: datum, vreme: vreme, ime: ime, telefon: telefon, usluga: usluga, cena: cena })
            });
            const data = await res.json();
            if(data.status === 'ok') {
                zatvoriNovoZakazivanje();
                showToast('✅ Termin uspešno zakazan!', 'success');
                ucitajNedelju();
            } else {
                showToast('❌ ' + (data.poruka || 'Greška pri zakazivanju!'), 'error');
            }
        } catch (error) {
            showToast('❌ Greška pri zakazivanju!', 'error');
        }
    }

    // ============================================
    // UPRAVLJANJE USLUGAMA - POPRAVLJENE FUNKCIJE
    // ============================================

    async function ucitajUslugeAdmin() {
        const container = document.getElementById('listaUslugaAdmin');
        
        try {
            const res = await fetch('/api/usluge');
            if (!res.ok) throw new Error('Greška pri učitavanju');
            
            const usluge = await res.json();
            
            if (usluge.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-zinc-500 border border-dashed border-zinc-700 rounded-lg">
                        <p class="text-sm">📭 Nema dodatih usluga</p>
                        <p class="text-xs text-zinc-600 mt-1">Dodajte prvu uslugu iznad</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = usluge.map(u => `
                <div class="service-item flex flex-col md:flex-row justify-between items-start md:items-center gap-3 p-3 bg-zinc-900/50 rounded-lg border border-zinc-700">
                    <div class="flex-1">
                        <span class="font-semibold text-zinc-200">${u.ime}</span>
                        <span class="text-xs ml-2 px-2 py-1 bg-amber-500/20 text-amber-400 rounded-full">${u.trajanje || 30} min</span>
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <div class="flex items-center gap-1 bg-zinc-800 rounded-lg px-2 py-1">
                            <span class="text-xs text-zinc-400">RSD</span>
                            <input type="number" 
                                   id="cena-${u.id}" 
                                   value="${u.cena}" 
                                   min="0" 
                                   step="50"
                                   class="w-20 p-1 bg-zinc-900 border border-zinc-700 rounded text-white text-center font-bold focus:border-amber-500 focus:outline-none">
                        </div>
                        <button onclick="sacuvajCenu(${u.id})" 
                                class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition-all">
                            💾
                        </button>
                        <button onclick="obrisiUslugu(${u.id})" 
                                class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition-all">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
            
        } catch (error) {
            console.error('Greška:', error);
            container.innerHTML = `
                <div class="text-center py-4 text-red-500 border border-red-500/30 rounded-lg">
                    <p>❌ Greška pri učitavanju usluga</p>
                    <button onclick="ucitajUslugeAdmin()" class="mt-2 text-xs text-amber-400 hover:underline">
                        Pokušaj ponovo
                    </button>
                </div>
            `;
        }
    }

    async function dodajNovuUslugu() {
        const ime = document.getElementById('novoIme').value.trim();
        const cena = document.getElementById('novaCena').value.trim();
        const trajanje = document.getElementById('novoTrajanje').value.trim();
        
        if (!ime) {
            showToast('⚠️ Unesite naziv usluge!', 'error');
            document.getElementById('novoIme').focus();
            return;
        }
        
        if (!cena || parseInt(cena) <= 0) {
            showToast('⚠️ Unesite ispravnu cenu!', 'error');
            document.getElementById('novaCena').focus();
            return;
        }
        
        const dugme = event.target;
        const originalText = dugme.textContent;
        dugme.textContent = '⏳ Dodavanje...';
        dugme.disabled = true;
        
        try {
            const response = await fetch('/api/usluge', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ime: ime,
                    cena: parseInt(cena),
                    trajanje: parseInt(trajanje) || 30
                })
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.poruka || 'Greška pri dodavanju');
            }
            
            // Očisti polja
            document.getElementById('novoIme').value = '';
            document.getElementById('novaCena').value = '';
            document.getElementById('novoTrajanje').value = '30';
            
            showToast('✅ Usluga "' + ime + '" uspešno dodata!', 'success');
            ucitajUslugeAdmin();
            
        } catch (error) {
            showToast('❌ Greška: ' + error.message, 'error');
        } finally {
            dugme.textContent = originalText;
            dugme.disabled = false;
        }
    }

    async function sacuvajCenu(id) {
        const cenaInput = document.getElementById(`cena-${id}`);
        const novaCena = parseInt(cenaInput.value);
        
        if (isNaN(novaCena) || novaCena < 0) {
            showToast('⚠️ Unesite ispravnu cenu!', 'error');
            cenaInput.focus();
            return;
        }
        
        try {
            const response = await fetch('/api/usluge/' + id, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ cena: novaCena })
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.poruka || 'Greška pri ažuriranju');
            }
            
            showToast('✅ Cena uspešno ažurirana na ' + novaCena + ' RSD', 'success');
            ucitajUslugeAdmin();
            
        } catch (error) {
            showToast('❌ Greška: ' + error.message, 'error');
        }
    }

    async function obrisiUslugu(id) {
        // Dohvati ime usluge za prikaz
        let ime = 'uslugu';
        try {
            const res = await fetch('/api/usluge');
            const usluge = await res.json();
            const usluga = usluge.find(u => u.id === id);
            if (usluga) ime = usluga.ime;
        } catch (e) {}
        
        if (!confirm(`⚠️ Da li ste sigurni da želite da obrišete "${ime}"?`)) {
            return;
        }
        
        try {
            const response = await fetch('/api/usluge/' + id, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.poruka || 'Greška pri brisanju');
            }
            
            showToast('✅ Usluga "' + ime + '" uspešno obrisana!', 'success');
            ucitajUslugeAdmin();
            
        } catch (error) {
            showToast('❌ Greška: ' + error.message, 'error');
        }
    }

    // ============================================
    // TOAST NOTIFIKACIJE
    // ============================================

    function showToast(message, type = 'info') {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ============================================
    // INICIJALIZACIJA
    // ============================================

    // Pokreni sve
    ucitajNedelju();
    ucitajUslugeAdmin();
    </script>
</body>
</html>
