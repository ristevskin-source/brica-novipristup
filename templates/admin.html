<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Rezervacije</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #121212; color: #e0e0e0; }
        h1, h2, h3 { color: #ffffff; }
        .nav-container { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        button { padding: 8px 16px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        #rasponNedelje { font-size: 16px; color: #a1a1aa; font-weight: bold; }
        
        .section { background: #1e1e1e; padding: 20px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #27272a; clear: both; }
        
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #18181b; min-width: 800px; }
        th, td { border: 1px solid #27272a; padding: 12px 10px; text-align: center; vertical-align: middle; }
        th { background: #2563eb; color: white; font-weight: 600; font-size: 14px; }
        td { font-size: 13px; color: #f4f4f5; }
        tr td:first-child { background: #27272a; font-weight: bold; color: #f4f4f5; width: 80px; }

        .form-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        input, select { padding: 8px; border: 1px solid #3f3f46; border-radius: 4px; background: #27272a; color: white; }
        
        #finansijeInfo { font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 10px; }

        /* Modal stilovi */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 350px; border: 1px solid #3f3f46; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Admin Panel - Rezervacije</h1>
    
    <!-- SEKCIJA: Kalendar i Nedelja -->
    <div class="section">
        <h2>Pregled termina po nedeljama</h2>
        <div class="nav-container">
            <button onclick="promeniNedelju(-1)">Prethodna</button>
            <span id="rasponNedelje"></span>
            <button onclick="promeniNedelju(1)">Sledeća</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr id="zaglavljeTabele"></tr>
                </thead>
                <tbody id="teloTabele">
                    <!-- Ovde se upisuju redovi -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- SEKCIJA: Finansije -->
    <div class="section">
        <h2>Finansije i Promet</h2>
        <div class="form-group">
            <label>Od:</label> <input type="date" id="finansijeOd">
            <label>Do:</label> <input type="date" id="finansijeDo">
            <button onclick="izracunajFinansije()">Izračunaj zaradu</button>
        </div>
        <div id="finansijeInfo">Ukupan promet: 0 RSD</div>
    </div>

    <!-- SEKCIJA: Upravljanje uslugama i cenama -->
    <div class="section">
        <h2>Usluge i Cene</h2>
        <div id="listaUslugaAdmin" style="margin-bottom: 15px;">
            <!-- Ovde se ucitavaju postojeće usluge -->
        </div>
        
        <h3>Dodaj novu uslugu</h3>
        <div class="form-group">
            <input type="text" id="novaUslugaNaziv" placeholder="Naziv usluge">
            <input type="number" id="novaUslugaCena" placeholder="Cena (RSD)">
            <input type="number" id="novaUslugaTrajanje" placeholder="Trajanje (min)">
            <button onclick="dodajUslugu()" style="background: #16a34a;">Dodaj uslugu</button>
        </div>
    </div>

    <!-- Modal za detalje klijenta -->
    <div id="detaljiKlijentaModal" class="modal">
        <div class="modal-content">
            <h3>📋 Detalji rezervacije</h3>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Datum i vreme: <strong id="detaljiVreme" style="color:#d4af37;"></strong></p>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Klijent: <strong id="detaljiIme" style="color:#fff;"></strong></p>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Usluga: <strong id="detaljiUsluga" style="color:#fff;"></strong></p>
            <p style="margin-bottom: 16px; color: #a1a1aa; font-size: 13px;">Cena: <strong id="detaljiCena" style="color:#4ade80;"></strong> RSD</p>

            <input type="hidden" id="otkaziDatum">
            <input type="hidden" id="otkaziVreme">

            <div class="modal-actions">
                <button onclick="naplatiTerminIzModala()" style="background:#16a34a; color:white;">💵 Naplaćeno</button>
                <button onclick="potvrdiOtkazivanjeIzModala()" style="background:#dc2626;">🗑️ Otkaži</button>
                <button onclick="zatvoriDetaljeKlijenta()" style="background:#52525b;">Zatvori</button>
            </div>
        </div>
    </div>

    <script>
        let trenutniPocetniDan = new Date();

        function formatirajDatum(d) {
            return d.toISOString().split('T')[0];
        }

        function promeniNedelju(smer) {
            trenutniPocetniDan.setDate(trenutniPocetniDan.getDate() + (smer * 7));
            ucitajNedelju();
        }

        async function ucitajNedelju() {
            let dani = [];
            let imenaDana = ['Ned', 'Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub'];
            let headerRow = '<th>Vreme</th>';
            
            let d = new Date(trenutniPocetniDan);
            while(dani.length < 6) {
                if (d.getDay() !== 0) {
                    let dStr = formatirajDatum(d);
                    dani.push(dStr);
                    let imeDana = imenaDana[d.getDay()];
                    headerRow += '<th>' + imeDana + '<br><span style="font-size:10px;color:#a1a1aa;">' + dStr.split('-').slice(1).join('.') + '</span></th>';
                }
                d.setDate(d.getDate() + 1);
            }
            document.getElementById('zaglavljeTabele').innerHTML = headerRow;

            let prviDan = dani[0];
            let poslednjiDan = dani[dani.length - 1];
            document.getElementById('rasponNedelje').innerText = prviDan + ' do ' + poslednjiDan;

            try {
                let res = await fetch(`/api/nedelja?pocetak=${prviDan}&kraj=${poslednjiDan}`);
                let podaci = await res.json();
                
                let zauzetiBlokovi = {};
                if (podaci) {
                    Object.keys(podaci).forEach(datum => {
                        Object.keys(podaci[datum]).forEach(vreme => {
                            let klijent = podaci[datum][vreme];
                            if (klijent) {
                                let trajanje = klijent.trajanje || 30;
                                let [h, m] = vreme.split(':').map(Number);
                                let ukupnoSlotova = Math.ceil(trajanje / 30);
                                for (let i = 0; i < ukupnoSlotova; i++) {
                                    let slotVreme = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                                    if (!zauzetiBlokovi[datum]) zauzetiBlokovi[datum] = {};
                                    zauzetiBlokovi[datum][slotVreme] = klijent;
                                    m += 30;
                                    if (m >= 60) {
                                        h += 1;
                                        m -= 60;
                                    }
                                }
                            }
                        });
                    });
                }

                let bodyHtml = '';
                let pocetniSat = 8;
                let krajnjiSat = 20;

                for (let sat = pocetniSat; sat < krajnjiSat; sat++) {
                    for (let min of [0, 30]) {
                        let vremeSlot = `${String(sat).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
                        bodyHtml += `<tr><td style="font-weight:bold; background:#27272a;">${vremeSlot}</td>`;

                        for (let datum of dani) {
                            let rezervacija = zauzetiBlokovi[datum] && zauzetiBlokovi[datum][vremeSlot];
                            if (rezervacija) {
                                bodyHtml += `<td onclick="otvoriDetaljeKlijenta('${datum}', '${vremeSlot}', '${rezervacija.ime || ''}', '${rezervacija.usluga || ''}', '${rezervacija.cena || 0}')" style="background:#0e495a; border:1px solid #164e63; cursor:pointer;">
                                    <strong>${rezervacija.ime || 'Rezervisano'}</strong><br>
                                    <small>${rezervacija.usluga || ''}</small>
                                </td>`;
                            } else {
                                bodyHtml += `<td style="color:#52525b;">-</td>`;
                            }
                        }
                        bodyHtml += `</tr>`;
                    }
                }
                document.getElementById('teloTabele').innerHTML = bodyHtml;

            } catch (err) {
                console.error("Greška pri učitavanju nedelje:", err);
            }
        }

        function otvoriDetaljeKlijenta(datum, vreme, ime, usluga, cena) {
            document.getElementById('detaljiVreme').innerText = `${datum} u ${vreme}`;
            document.getElementById('detaljiIme').innerText = ime;
            document.getElementById('detaljiUsluga').innerText = usluga;
            document.getElementById('detaljiCena').innerText = cena;
            document.getElementById('otkaziDatum').value = datum;
            document.getElementById('otkaziVreme').value = vreme;
            document.getElementById('detaljiKlijentaModal').style.display = 'flex';
        }

        function zatvoriDetaljeKlijenta() {
            document.getElementById('detaljiKlijentaModal').style.display = 'none';
        }

        async function naplatiTerminIzModala() {
            const datum = document.getElementById('otkaziDatum').value;
            const vreme = document.getElementById('otkaziVreme').value;
            await fetch('/api/otkazi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ datum: datum, vreme: vreme })
            });
            zatvoriDetaljeKlijenta();
            ucitajNedelju();
        }

        async function potvrdiOtkazivanjeIzModala() {
            const datum = document.getElementById('otkaziDatum').value;
            const vreme = document.getElementById('otkaziVreme').value;
            await fetch('/api/otkazi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ datum: datum, vreme: vreme })
            });
            zatvoriDetaljeKlijenta();
            ucitajNedelju();
        }

        async function ucitajUslugeAdmin() {
            try {
                let res = await fetch('/api/usluge');
                let usluge = await res.json();
                let html = '<ul>';
                if (Array.isArray(usluge)) {
                    usluge.forEach(u => {
                        html += `<li style="margin-bottom: 5px;"><b>${u.naziv}</b> - ${u.cena} RSD (${u.trajanje} min)</li>`;
                    });
                }
                html += '</ul>';
                document.getElementById('listaUslugaAdmin').innerHTML = html;
            } catch (e) {
                console.error("Greška usluge:", e);
            }
        }

        async function dodajUslugu() {
            let naziv = document.getElementById('novaUslugaNaziv').value;
            let cena = document.getElementById('novaUslugaCena').value;
            let trajanje = document.getElementById('novaUslugaTrajanje').value;
            if (!naziv || !cena) { alert("Unesi naziv i cenu!"); return; }
            await fetch('/api/usluge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ naziv, cena: Number(cena), trajanje: Number(trajanje || 30) })
            });
            document.getElementById('novaUslugaNaziv').value = '';
            document.getElementById('novaUslugaCena').value = '';
            document.getElementById('novaUslugaTrajanje').value = '';
            ucitajUslugeAdmin();
        }

        async function izracunajFinansije() {
            let odDatuma = document.getElementById('finansijeOd').value;
            let doDatuma = document.getElementById('finansijeDo').value;
            if(!odDatuma || !doDatuma) { alert("Izaberi oba datuma!"); return; }
            try {
                let res = await fetch(`/api/finansije?od=${odDatuma}&do=${doDatuma}`);
                let data = await res.json();
                document.getElementById('finansijeInfo').innerText = `Ukupan promet: ${data.ukupno || 0} RSD`;
            } catch(e) { console.error("Greška finansije:", e); }
        }

        ucitajNedelju();
        ucitajUslugeAdmin();
    </script>
</body>
</html>
