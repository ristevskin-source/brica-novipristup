<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Brica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Zaglavlje -->
        <div class="flex justify-between items-center mb-8 border-b border-zinc-700 pb-4">
            <h1 class="text-3xl font-bold text-amber-500">💈 Admin Panel - Brica</h1>
            <a href="/" class="bg-zinc-700 hover:bg-zinc-600 text-white px-4 py-2 rounded font-semibold text-sm">Nazad na sajt</a>
        </div>

        <!-- Navigacija za nedelje -->
        <div class="flex justify-between items-center bg-zinc-800 p-4 rounded-lg mb-6 border border-zinc-700">
            <button onclick="promeniNedelju(-1)" class="bg-amber-600 hover:bg-amber-500 text-black px-4 py-2 rounded font-bold">← Prethodna nedelja</button>
            <span id="rasponNedelje" class="text-lg font-bold text-zinc-300"></span>
            <button onclick="promeniNedelju(1)" class="bg-amber-600 hover:bg-amber-500 text-black px-4 py-2 rounded font-bold">Sledeća nedelja →</button>
        </div>

        <!-- Tabela rasporeda -->
        <div class="overflow-x-auto bg-zinc-800 rounded-lg border border-zinc-700 mb-8">
            <table class="w-full text-left text-sm">
                <thead class="bg-zinc-700 text-amber-500 uppercase font-bold text-center">
                    <tr id="zaglavljeTabele">
                        <th class="p-3 border-b border-zinc-600">Vreme</th>
                        <!-- Dani se generišu dinamički -->
                    </tr>
                </thead>
                <tbody id="teloTabele" class="divide-y divide-zinc-700 text-center">
                    <!-- Slotovi se generišu dinamički -->
                </tbody>
            </table>
        </div>

        <!-- Sekcija za upravljanje uslugama -->
        <div class="bg-zinc-800 p-6 rounded-lg border border-zinc-700">
            <h2 class="text-xl font-bold text-amber-500 mb-4">Upravljanje uslugama i cenama</h2>
            
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Forma za dodavanje -->
                <div>
                    <h3 class="text-md font-semibold text-zinc-300 mb-3">Dodaj novu uslugu</h3>
                    <div class="space-y-3">
                        <input type="text" id="novoIme" placeholder="Naziv usluge (npr. Šišanje)" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white">
                        <input type="number" id="novaCena" placeholder="Cena u RSD" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white">
                        <input type="number" id="novoTrajanje" placeholder="Trajanje u minutima (npr. 30)" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white" value="30">
                        <button onclick="dodajNovuUslugu()" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-2 rounded">Dodaj uslugu</button>
                    </div>
                </div>

                <!-- Lista postojećih usluga -->
                <div>
                    <h3 class="text-md font-semibold text-zinc-300 mb-3">Postojeće usluge</h3>
                    <ul id="listaUslugaAdmin" class="space-y-2">
                        <!-- Generiše se dinamički -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal za ručno zakazivanje -->
    <div id="novaRezervacijaModal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden">
        <div class="bg-zinc-800 p-6 rounded-lg border border-zinc-700 w-full max-w-md">
            <h3 class="text-lg font-bold text-amber-500 mb-4">Zakazivanje termina</h3>
            <div class="space-y-3">
                <input type="hidden" id="adminDatum">
                <input type="hidden" id="adminVreme">
                <div>
                    <label class="text-xs text-zinc-400">Ime klijenta:</label>
                    <input type="text" id="adminIme" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white">
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Telefon:</label>
                    <input type="text" id="adminTel" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white">
                </div>
                <div>
                    <label class="text-xs text-zinc-400">Usluga:</label>
                    <select id="adminUsluga" class="w-full p-2 bg-zinc-900 border border-zinc-700 rounded text-white"></select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="sacuvajAdminZakazivanje()" class="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-2 rounded">Potvrdi</button>
                    <button onclick="zatvoriNovoZakazivanje()" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-2 rounded">Otkaži</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    let trenutniPonedeljak = getPonedeljak(new Date());

    function getPonedeljak(d) {
        d = new Date(d);
        let day = d.getDay(),
            diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }

    function formatirajDatum(d) {
        return d.toISOString().split('T')[0];
    }

    function promeniNedelju(smer) {
        trenutniPonedeljak.setDate(trenutniPonedeljak.getDate() + (smer * 7));
        ucitajNedelju();
    }

    async function ucitajNedelju() {
        let dani = [];
        let imenaDana = ['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub'];
        
        let headerRow = '<th class="p-3 border-b border-zinc-600">Vreme</th>';
        for(let i=0; i<6; i++) {
            let d = new Date(trenutniPonedeljak);
            d.setDate(d.getDate() + i);
            let dStr = formatirajDatum(d);
            dani.push(dStr);
            headerRow += `<th class="p-3 border-b border-zinc-600">${imenaDana[i]}<br><span class="text-xs text-zinc-400">${dStr.split('-').slice(1).join('.')}</span></th>`;
        }
        document.getElementById('zaglavljeTabele').innerHTML = headerRow;

        let prviDan = dani[0];
        let poslednjiDan = dani[5];
        document.getElementById('rasponNedelje').innerText = `${prviDan} do ${poslednjiDan}`;

        let res = await fetch(`/api/raspored_nedelja?pocetak=${prviDan}&kraj=${poslednjiDan}`);
        let podaci = await res.json();

        let sati = ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30"];
        
        let tbody = '';
        sati.forEach(vreme => {
            tbody += `<tr><td class="p-2 font-bold text-amber-500 border-r border-zinc-700">${vreme}</td>`;
            dani.forEach(datum => {
                let klijent = podaci[datum] && podaci[datum][vreme] ? podaci[datum][vreme] : null;
                if(klijent && klijent.status === 'zauzet') {
                    tbody += `
                        <td class="p-2 border border-zinc-700 bg-red-900/40 text-red-200">
                            <div class="font-bold text-xs">${klijent.ime || 'Zauzeto'}</div>
                            <div class="text-[10px] text-zinc-400">${klijent.usluga || ''} (${klijent.cena || 0} RSD)</div>
                            <button onclick="oslobodiTermin('${datum}', '${vreme}')" class="mt-1 bg-red-800 hover:bg-red-700 text-white text-[10px] px-2 py-0.5 rounded">Oslobodi</button>
                        </td>`;
                } else {
                    tbody += `
                        <td class="p-2 border border-zinc-700 hover:bg-zinc-700/50 cursor-pointer" onclick="otvoriZakazivanje('${datum}', '${vreme}')">
                            <span class="text-xs text-zinc-500">+ Zakazi</span>
                        </td>`;
                }
            });
            tbody += `</tr>`;
        });
        document.getElementById('teloTabele').innerHTML = tbody;
    }

    async function oslobodiTermin(datum, vreme) {
        if(confirm(`Da li otkazujete termin ${datum} u ${vreme}?`)) {
            await fetch('/api/otkazi', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({datum, vreme})
            });
            ucitajNedelju();
        }
    }

    async function otvoriZakazivanje(datum, vreme) {
        document.getElementById('adminDatum').value = datum;
        document.getElementById('adminVreme').value = vreme;
        document.getElementById('adminIme').value = '';
        document.getElementById('adminTel').value = '';

        let res = await fetch('/api/usluge');
        let usluge = await res.json();
        let select = document.getElementById('adminUsluga');
        select.innerHTML = usluge.map(u => `<option value="${u.ime}|${u.cena}">${u.ime} (${u.cena} RSD)</option>`).join('');

        document.getElementById('novaRezervacijaModal').classList.remove('hidden');
    }

    function zatvoriNovoZakazivanje() {
        document.getElementById('novaRezervacijaModal').classList.add('hidden');
    }

    async function sacuvajAdminZakazivanje() {
        const datum = document.getElementById('adminDatum').value;
        const vreme = document.getElementById('adminVreme').value;
        const ime = document.getElementById('adminIme').value;
        const telefon = document.getElementById('adminTel').value;
        const uslugaVal = document.getElementById('adminUsluga').value.split('|');
        const usluga = uslugaVal[0];
        const cena = parseInt(uslugaVal[1]);

        const res = await fetch('/api/zakazi', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ datum, vreme, ime, telefon, usluga, cena })
        });
        const data = await res.json();
        if(data.status === 'ok') {
            zatvoriNovoZakazivanje();
            ucitajNedelju();
        } else {
            alert(data.poruka || 'Greška pri zakazivanju!');
        }
    }

    async function ucitajUslugeAdmin() {
        let res = await fetch('/api/usluge');
        let usluge = await res.json();
        let lista = document.getElementById('listaUslugaAdmin');
        if(!lista) return;
        lista.innerHTML = '';
        usluge.forEach(u => {
            lista.innerHTML += `
                <li class="flex justify-between items-center py-2 border-b border-zinc-700">
                    <span class="font-semibold text-zinc-200">${u.ime} (${u.trajanje || 30} min)</span>
                    <div class="flex gap-2 items-center">
                        <input type="number" id="cena-${u.id}" value="${u.cena}" class="w-20 p-1 text-black text-center rounded font-bold">
                        <button onclick="sacuvajCenu(${u.id}, '${u.ime}', ${u.trajanje || 30})" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded font-bold text-xs">Sačuvaj</button>
                        <button onclick="obrisiUslugu(${u.id})" class="bg-red-600 hover:bg-red-500 text-white px-2 py-1 rounded font-bold text-xs">✕</button>
                    </div>
                </li>
            `;
        });
    }

    async function dodajNovuUslugu() {
        let ime = document.getElementById('novoIme').value;
        let cena = document.getElementById('novaCena').value;
        let trajanje = document.getElementById('novoTrajanje') ? document.getElementById('novoTrajanje').value : 30;
        
        if(!ime || !cena) return alert('Unesite naziv i cenu!');
        
        await fetch('/api/usluge', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                ime: ime, 
                cena: parseInt(cena), 
                trajanje: parseInt(trajanje) || 30
            })
        });
        document.getElementById('novoIme').value = '';
        document.getElementById('novaCena').value = '';
        ucitajUslugeAdmin();
    }

    async function sacuvajCenu(id, ime, trajanje) {
        let novaCena = document.getElementById(`cena-${id}`).value;
        await fetch(`/api/usluge/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                ime: ime,
                cena: parseInt(novaCena),
                trajanje: parseInt(trajanje) || 30
            })
        });
        alert('Cena uspešno izmenjena!');
        ucitajUslugeAdmin();
    }

    async function obrisiUslugu(id) {
        if(confirm('Da li ste sigurni da želite da obrišete ovu uslugu?')) {
            await fetch(`/api/usluge/${id}`, { method: 'DELETE' });
            ucitajUslugeAdmin();
        }
    }

    ucitajNedelju();
    ucitajUslugeAdmin();
    </script>
</body>
</html>
