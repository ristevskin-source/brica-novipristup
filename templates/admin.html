<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Rezervacije i Usluge</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #121212; color: #e0e0e0; }
        h1, h2, h3 { color: #ffffff; }
        .nav-container { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        button { padding: 8px 16px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        #rasponNedelje { font-size: 16px; color: #a1a1aa; font-weight: bold; }

        .section { background: #1e1e1e; padding: 20px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #27272a; clear: both; }

        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: #18181b; min-width: 800px; }
        th, td { border: 1px solid #27272a; padding: 12px 10px; text-align: center; vertical-align: middle; }
        th { background: #2563eb; color: white; font-weight: 600; font-size: 14px; }
        td { font-size: 13px; color: #f4f4f5; }
        tr td:first-child { background: #27272a; font-weight: bold; color: #f4f4f5; width: 80px; }

        .form-group { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        input, select { padding: 8px; border: 1px solid #3f3f46; border-radius: 4px; background: #27272a; color: white; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        #finansijeInfo { font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 10px; }

        .usluga-item { display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 12px 15px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #3f3f46; flex-wrap: wrap; gap: 10px; }
        .usluga-inputs { display: flex; gap: 10px; align-items: center; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 350px; border: 1px solid #3f3f46; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }

        .today-header { background: #d4af37 !important; color: #000 !important; }
        .today-cell { border-top: 2px solid #d4af37; }
        .pauza-cell { background: #18181b; color: #52525b; font-size: 10px; }
    </style>
<base target="_blank">
</head>
<body>

    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <h1>Admin Panel - Upravljanje</h1>
    <a href="/" style="color:#3b82f6; text-decoration:none; font-size:14px; font-weight:bold;">← Nazad na sajt</a>
</div>

    <!-- SEKCIJA: Kalendar i Nedelja -->
    <div class="section">
        <h2>Pregled termina po nedeljama</h2>
        <div class="nav-container">
            <button onclick="promeniNedelju(-1)">Prethodna</button>
            <span id="rasponNedelje"></span>
            <button onclick="promeniNedelju(1)">Sledeća</button>
            <button onclick="idiNaTrenutnuNedelju()" style="background:#16a34a;">Danas</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr id="zaglavljeTabele"></tr>
                </thead>
                <tbody id="teloTabele">
                </tbody>
            </table>
        </div>
    </div>

    <!-- SEKCIJA: Finansije -->
    <div class="section">
        <h2>Finansije i Promet</h2>
        <div class="form-group">
            <label>Od:</label> <input type="date" id="finansijeOd">
            <label>Do:</label> <input type="date" id="finansijeDo">
            <button onclick="izracunajFinansije()">Izračunaj zaradu</button>
        </div>
        <div id="finansijeInfo">Ukupan promet: 0 RSD</div>
    </div>

    <!-- SEKCIJA: Upravljanje uslugama i cenama -->
    <div class="section">
        <h2>Usluge, Cene i Trajanje</h2>

        <h3>Dodaj novu uslugu</h3>
        <div class="form-group">
            <input type="text" id="novaUslugaNaziv" placeholder="Naziv usluge">
            <input type="text" id="novaUslugaCena" placeholder="Cena (RSD)">
            <input type="text" id="novaUslugaTrajanje" placeholder="Trajanje (min)">
            <button onclick="dodajUslugu()" style="background: #16a34a;">Dodaj uslugu</button>
        </div>

        <h3 style="margin-top: 20px;">Postojeće usluge (Direktna izmena)</h3>
        <div id="listaUslugaAdmin">
            <p style="color: #a1a1aa;">Učitavanje usluga...</p>
        </div>
    </div>

    <!-- Modal za detalje klijenta -->
    <div id="detaljiKlijentaModal" class="modal">
        <div class="modal-content">
            <h3>📋 Detalji rezervacije</h3>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Datum i vreme: <strong id="detaljiVreme" style="color:#d4af37;"></strong></p>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Klijent: <strong id="detaljiIme" style="color:#fff;"></strong></p>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Telefon: <strong id="detaljiTelefon" style="color:#22d3ee;"></strong></p>
            <p style="margin-bottom: 8px; color: #a1a1aa; font-size: 13px;">Usluga: <strong id="detaljiUsluga" style="color:#fff;"></strong></p>
            <p style="margin-bottom: 16px; color: #a1a1aa; font-size: 13px;">Cena: <strong id="detaljiCena" style="color:#4ade80;"></strong> RSD</p>

            <input type="hidden" id="otkaziDatum">
            <input type="hidden" id="otkaziVreme">
            <input type="hidden" id="otkaziIme">
            <input type="hidden" id="otkaziUsluga">
            <input type="hidden" id="otkaziCena">

            <div class="modal-actions">
                <button onclick="naplatiTerminIzModala()" style="background:#16a34a; color:white;">💵 Naplaćeno</button>
                <button onclick="potvrdiOtkazivanjeIzModala()" style="background:#dc2626;">🗑️ Otkaži</button>
                <button onclick="zatvoriDetaljeKlijenta()" style="background:#52525b;">Zatvori</button>
            </div>
        </div>
    </div>

    <script>
        let trenutniOffset = 0;
        const imenaDana = ['Ned', 'Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub'];

        // === ISPRAVKA 1: Lokalni datum (NE toISOString!) ===
        function formatirajDatum(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        // === ISPRAVKA 2: Uvek kreći od ponedeljka ===
        function getPonedeljak(offset) {
            const d = new Date();
            const day = d.getDay(); // 0=ned, 1=pon...
            const diff = d.getDate() - day + (day === 0 ? -6 : 1) + (offset * 7);
            const ponedeljak = new Date(d.setDate(diff));
            return new Date(ponedeljak.setHours(0, 0, 0, 0));
        }

        function promeniNedelju(smer) {
            trenutniOffset += smer;
            ucitajNedelju();
        }

        function idiNaTrenutnuNedelju() {
            trenutniOffset = 0;
            ucitajNedelju();
        }

        async function ucitajNedelju() {
            const ponedeljak = getPonedeljak(trenutniOffset);
            const dani = [];
            let headerRow = '<th>Vreme</th>';
            const danasStr = formatirajDatum(new Date());

            for (let i = 0; i < 6; i++) {
                const d = new Date(ponedeljak);
                d.setDate(ponedeljak.getDate() + i);
                const dStr = formatirajDatum(d);
                dani.push(dStr);
                const imeDana = imenaDana[d.getDay()];
                const isToday = (dStr === danasStr) ? 'today-header' : '';
                headerRow += '<th class="' + isToday + '">' + imeDana + '<br><span style="font-size:10px;color:#a1a1aa;">' + dStr.split('-').slice(1).join('.') + '</span></th>';
            }
            document.getElementById('zaglavljeTabele').innerHTML = headerRow;

            const prviDan = dani[0];
            const poslednjiDan = dani[dani.length - 1];
            document.getElementById('rasponNedelje').innerText = prviDan + ' do ' + poslednjiDan;

            try {
                let res = await fetch('/api/nedelja?pocetak=' + prviDan + '&kraj=' + poslednjiDan);
                let podaci = await res.json();

                let zauzetiBlokovi = {};
                if (podaci) {
                    Object.keys(podaci).forEach(function(datum) {
                        Object.keys(podaci[datum]).forEach(function(vreme) {
                            let klijent = podaci[datum][vreme];
                            if (klijent) {
                                let trajanje = klijent.trajanje || 30;
                                let parts = vreme.split(':');
                                let h = parseInt(parts[0]);
                                let m = parseInt(parts[1]);
                                let ukupnoSlotova = Math.ceil(trajanje / 30);
                                for (let i = 0; i < ukupnoSlotova; i++) {
                                    let slotVreme = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
                                    if (!zauzetiBlokovi[datum]) zauzetiBlokovi[datum] = {};
                                    zauzetiBlokovi[datum][slotVreme] = klijent;
                                    m += 30;
                                    if (m >= 60) {
                                        h += 1;
                                        m -= 60;
                                    }
                                }
                            }
                        });
                    });
                }

                let bodyHtml = '';
                let pocetniSat = 9;
                let krajnjiSat = 20;

                for (let sat = pocetniSat; sat < krajnjiSat; sat++) {
                    for (let min of [0, 30]) {
                        let vremeSlot = String(sat).padStart(2, '0') + ':' + String(min).padStart(2, '0');
                        let isPauza = (vremeSlot >= "13:00" && vremeSlot < "14:00");
                        bodyHtml += '<tr><td style="font-weight:bold; background:#27272a;">' + vremeSlot + '</td>';

                        for (let datum of dani) {
                            let isTodayCol = (datum === danasStr) ? 'today-cell' : '';
                            let rezervacija = zauzetiBlokovi[datum] && zauzetiBlokovi[datum][vremeSlot];

                            if (isPauza) {
                                bodyHtml += '<td class="pauza-cell ' + isTodayCol + '">PAUZA</td>';
                            } else if (rezervacija) {
                                let safeIme = (rezervacija.ime || '').replace(/'/g, "\'");
                                let safeUsluga = (rezervacija.usluga || '').replace(/'/g, "\'");
                                let safeTelefon = (rezervacija.telefon || '').replace(/'/g, "\'");
                                bodyHtml += '<td onclick="otvoriDetaljeKlijenta(' + 
                                    "'" + datum + "', '" + vremeSlot + "', '" + safeIme + "', '" + safeUsluga + "', '" + (rezervacija.cena || 0) + "', '" + safeTelefon + "')" + 
                                    '" style="background:#0e495a; border:1px solid #164e63; cursor:pointer;" class="' + isTodayCol + '">' +
                                    '<strong>' + (rezervacija.ime || 'Rezervisano') + '</strong><br>' +
                                    '<small>' + (rezervacija.usluga || '') + '</small>' +
                                    '</td>';
                            } else {
                                bodyHtml += '<td style="color:#52525b;" class="' + isTodayCol + '">-</td>';
                            }
                        }
                        bodyHtml += '</tr>';
                    }
                }
                document.getElementById('teloTabele').innerHTML = bodyHtml;

            } catch (err) {
                console.error("Greška pri učitavanju nedelje:", err);
                document.getElementById('teloTabele').innerHTML = '<tr><td colspan="7" style="color:#f87171; padding:20px;">Greška pri učitavanju podataka. Proveri da li je backend pokrenut.</td></tr>';
            }
        }

        function otvoriDetaljeKlijenta(datum, vreme, ime, usluga, cena, telefon) {
            document.getElementById('detaljiVreme').innerText = datum + ' u ' + vreme;
            document.getElementById('detaljiIme').innerText = ime || 'Nepoznato';
            document.getElementById('detaljiTelefon').innerText = telefon || 'Nema';
            document.getElementById('detaljiUsluga').innerText = usluga || '-';
            document.getElementById('detaljiCena').innerText = cena;
            document.getElementById('otkaziDatum').value = datum;
            document.getElementById('otkaziVreme').value = vreme;
            document.getElementById('otkaziIme').value = ime;
            document.getElementById('otkaziUsluga').value = usluga;
            document.getElementById('otkaziCena').value = cena;
            document.getElementById('detaljiKlijentaModal').style.display = 'flex';
        }

        function zatvoriDetaljeKlijenta() {
            document.getElementById('detaljiKlijentaModal').style.display = 'none';
        }

        // === ISPRAVKA 3: Naplata šalje na /api/naplati (ne na /api/otkazi!) ===
        async function naplatiTerminIzModala() {
            const datum = document.getElementById('otkaziDatum').value;
            const vreme = document.getElementById('otkaziVreme').value;
            const ime = document.getElementById('otkaziIme').value;
            const usluga = document.getElementById('otkaziUsluga').value;
            const cena = document.getElementById('otkaziCena').value;

            await fetch('/api/naplati', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ datum: datum, vreme: vreme, ime: ime, usluga: usluga, cena: cena })
            });
            zatvoriDetaljeKlijenta();
            ucitajNedelju();
        }

        async function potvrdiOtkazivanjeIzModala() {
            if (!confirm('Da li si siguran da želiš da otkažeš ovaj termin?')) return;
            const datum = document.getElementById('otkaziDatum').value;
            const vreme = document.getElementById('otkaziVreme').value;
            await fetch('/api/otkazi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ datum: datum, vreme: vreme })
            });
            zatvoriDetaljeKlijenta();
            ucitajNedelju();
        }

        // === ISPRAVKA 4: Usluge koriste ID, šalju 'ime' (ne 'naziv'), PUT/DELETE ===
        async function ucitajUslugeAdmin() {
            try {
                let res = await fetch('/api/usluge');
                let usluge = await res.json();
                let kontejner = document.getElementById('listaUslugaAdmin');

                if (!usluge || usluge.length === 0) {
                    kontejner.innerHTML = '<p style="color: #a1a1aa;">Nema unetih usluga.</p>';
                    return;
                }

                let html = '';
                usluge.forEach(function(u) {
                    html += '<div class="usluga-item">' +
                        '<div><strong style="color: #fff; font-size: 15px;">' + u.ime + '</strong></div>' +
                        '<div class="usluga-inputs">' +
                            '<input type="text" id="ime_' + u.id + '" value="' + u.ime + '" style="width: 140px;" placeholder="Naziv">' +
                            '<input type="text" id="cena_' + u.id + '" value="' + u.cena + '" style="width: 90px;" placeholder="Cena"> RSD ' +
                            '<input type="text" id="trajanje_' + u.id + '" value="' + (u.trajanje || 30) + '" style="width: 70px;" placeholder="Min"> min ' +
                            '<button onclick="sacuvajUslugu(' + u.id + ')" style="background: #ca8a04; padding: 6px 12px; font-size: 12px;">Sačuvaj</button>' +
                            '<button onclick="obrisiUslugu(' + u.id + ')" style="background: #dc2626; padding: 6px 12px; font-size: 12px;">Obriši</button>' +
                        '</div></div>';
                });
                kontejner.innerHTML = html;
            } catch (e) {
                console.error("Greška pri učitavanju usluga:", e);
                document.getElementById('listaUslugaAdmin').innerHTML = '<p style="color: #f87171;">Greška pri učitavanju usluga sa servera.</p>';
            }
        }

        // === ISPRAVKA 5: Dodavanje šalje 'ime' (ne 'naziv') ===
        async function dodajUslugu() {
            let ime = document.getElementById('novaUslugaNaziv').value.trim();
            let cena = document.getElementById('novaUslugaCena').value.trim();
            let trajanje = document.getElementById('novaUslugaTrajanje').value.trim();

            if (!ime || !cena) { 
                alert("Unesi naziv i cenu usluge!"); 
                return; 
            }

            await fetch('/api/usluge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ime: ime, cena: Number(cena), trajanje: Number(trajanje || 30) })
            });

            document.getElementById('novaUslugaNaziv').value = '';
            document.getElementById('novaUslugaCena').value = '';
            document.getElementById('novaUslugaTrajanje').value = '';
            ucitajUslugeAdmin();
        }

        // === ISPRAVKA 6: Izmena koristi PUT na /api/usluge/<id> ===
        async function sacuvajUslugu(id) {
            let ime = document.getElementById('ime_' + id).value.trim();
            let cena = document.getElementById('cena_' + id).value.trim();
            let trajanje = document.getElementById('trajanje_' + id).value.trim();

            if (!ime || !cena) {
                alert("Naziv i cena ne mogu biti prazni!");
                return;
            }

            await fetch('/api/usluge/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ime: ime, cena: Number(cena), trajanje: Number(trajanje || 30) })
            });
            alert('Usluga "' + ime + '" je uspešno sačuvana!');
            ucitajUslugeAdmin();
        }

        // === ISPRAVKA 7: Brisanje koristi DELETE na /api/usluge/<id> ===
        async function obrisiUslugu(id) {
            if (!confirm('Da li si siguran da želiš da obrišeš ovu uslugu?')) return;

            await fetch('/api/usluge/' + id, {
                method: 'DELETE'
            });
            ucitajUslugeAdmin();
        }

        // === ISPRAVKA 8: Finansije ruta postoji na backendu ===
        async function izracunajFinansije() {
            let odDatuma = document.getElementById('finansijeOd').value;
            let doDatuma = document.getElementById('finansijeDo').value;
            if(!odDatuma || !doDatuma) { alert("Izaberi oba datuma za finansije!"); return; }
            try {
                let res = await fetch('/api/finansije?od=' + odDatuma + '&do=' + doDatuma);
                let data = await res.json();
                document.getElementById('finansijeInfo').innerText = 'Ukupan promet: ' + (data.ukupno || 0) + ' RSD';
            } catch(e) { console.error("Greška finansije:", e); }
        }

        // Zatvori modal na klik van njega
        document.getElementById('detaljiKlijentaModal').addEventListener('click', function(e) {
            if (e.target === this) zatvoriDetaljeKlijenta();
        });

        // Pokretanje
        ucitajNedelju();
        ucitajUslugeAdmin();
    </script>
</body>
</html>
