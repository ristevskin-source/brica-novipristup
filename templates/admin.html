<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kod Kubanca — Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .gold-border { border-color: #d4af37; }
        .gold-bg { background-color: #d4af37; }
        .gold-text { color: #d4af37; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto space-y-6">

    <div class="flex justify-between items-center mt-2">
        <h1 class="text-2xl font-bold gold-text">💈 Admin Panel</h1>
        <a href="/" class="text-xs bg-zinc-800 p-2 rounded border border-zinc-700 text-gray-300">Nazad na sajt</a>
    </div>

    <!-- Sekcija 1: Upravljanje Uslugama -->
    <div class="bg-zinc-900 p-4 rounded-xl border gold-border space-y-4">
        <h2 class="text-lg font-bold gold-text">✂️ Upravljanje Uslugama i Cenama</h2>
        
        <!-- Forma za dodavanje nove usluge -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <input type="text" id="novaUslugaIme" placeholder="Naziv (npr. Pranje kose)" class="bg-zinc-800 p-2.5 rounded text-sm text-white border border-zinc-700">
            <input type="number" id="novaUslugaCena" placeholder="Cena (RSD)" class="bg-zinc-800 p-2.5 rounded text-sm text-white border border-zinc-700">
            <input type="number" id="novaUslugaTrajanje" placeholder="Trajanje (min)" value="30" class="bg-zinc-800 p-2.5 rounded text-sm text-white border border-zinc-700">
        </div>
        <button onclick="dodajNovuUslugu()" class="w-full py-2.5 gold-bg text-black font-bold rounded-lg text-sm">
            ➕ Dodaj Uslugu
        </button>

        <!-- Lista postojećih usluga -->
        <div id="adminUslugeLista" class="space-y-2 pt-2">
            <!-- Dinamički se puni preko JS-a -->
        </div>
    </div>

    <!-- Sekcija 2: Pregled Zakazanih Termina -->
    <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
        <h2 class="text-lg font-bold gold-text mb-3">📅 Pregled Zakazanih Termina</h2>
        <input type="date" id="adminDatum" class="w-full bg-zinc-800 text-white p-3 rounded-lg border border-zinc-700 outline-none mb-4">
        
        <div id="listaTermina" class="space-y-3">
            <!-- Termin kartice -->
        </div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        const datumInput = document.getElementById('adminDatum');
        datumInput.value = today;

        datumInput.addEventListener('change', ucitajZakazane);

        async function ucitajUsluge() {
            const res = await fetch('/api/usluge');
            const usluge = await res.json();
            const container = document.getElementById('adminUslugeLista');

            if (usluge.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 italic">Nema unetih usluga.</p>`;
                return;
            }

            container.innerHTML = usluge.map(u => `
                <div class="p-3 bg-zinc-800 rounded-lg border border-zinc-700 flex justify-between items-center">
                    <div>
                        <span class="font-bold text-white text-sm">${u.ime}</span>
                        <span class="text-xs text-gray-400 ml-2">(${u.trajanje} min)</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="gold-text font-bold text-sm">${u.cena} din</span>
                        <button onclick="obrisiUslugu(${u.id})" class="text-xs text-red-400 hover:text-red-300 bg-red-950/50 p-1.5 rounded border border-red-800">
                            🗑️ Obrisi
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function dodajNovuUslugu() {
            const ime = document.getElementById('novaUslugaIme').value;
            const cena = document.getElementById('novaUslugaCena').value;
            const trajanje = document.getElementById('novaUslugaTrajanje').value;

            if(!ime || !cena || !trajanje) return alert("Popunite sva polja za novu uslugu!");

            await fetch('/api/usluge', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ime, cena: parseInt(cena), trajanje: parseInt(trajanje) })
            });

            document.getElementById('novaUslugaIme').value = '';
            document.getElementById('novaUslugaCena').value = '';
            ucitajUsluge();
        }

        async function obrisiUslugu(id) {
            if(!confirm("Da li ste sigurni da želite da obrišete ovu uslugu?")) return;
            await fetch(`/api/usluge/${id}`, { method: 'DELETE' });
            ucitajUsluge();
        }

        async function ucitajZakazane() {
            const datum = datumInput.value;
            const res = await fetch(`/api/slotovi/${datum}`);
            const slotovi = await res.json();
            const container = document.getElementById('listaTermina');

            const zakazani = slotovi.filter(s => s.status === 'zakazan');

            if(zakazani.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm italic text-center py-4">Nema zakazanih termina za izabrani datum.</p>`;
                return;
            }

            container.innerHTML = zakazani.map(s => `
                <div class="p-4 rounded-lg bg-zinc-800 border border-zinc-700 flex justify-between items-center">
                    <div>
                        <div class="gold-text font-bold text-lg">⏰ ${s.vreme} h</div>
                        <div class="font-semibold text-white">${s.ime || 'Nije uneto ime'}</div>
                        <div class="text-sm text-gray-400">📞 ${s.telefon || 'Nije unet telefon'}</div>
                    </div>
                    <div class="text-right">
                        <span class="bg-yellow-500/10 text-yellow-500 border border-yellow-500/30 text-xs px-2 py-1 rounded font-semibold block mb-1">
                            ${s.usluga || 'Usluga'}
                        </span>
                        <div class="text-sm font-bold text-gray-300">${s.cena || 0} din</div>
                    </div>
                </div>
            `).join('');
        }

        ucitajUsluge();
        ucitajZakazane();
    </script>
</body>
</html>
